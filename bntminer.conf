# BntMiner - Blocknet (BNT), Argon2id 2 GiB, on bntpool.com
# stratum+tcp://bntpool.com:3333, fee 2.5 %, PPLNS 6 h, minimum payment 0.1 BNT, 60 confirmations
pool = stratum+tcp://bntpool.com:3333
# your Blocknet address (or a blocknet.id shortname @name / $name)
user = YOUR_BLOCKNET_ADDRESS
worker = rig1
# GPUs: all, or a list like 0,1,2 (PCI bus order, as nvidia-smi)
gpus = all
# hashes in parallel per GPU (2 GiB of GPU memory each), 0 = as many as the memory allows
lanes = 0
# GPU memory left free (MB)
reserve-mb = 160
# summary line every N seconds
stats = 60
